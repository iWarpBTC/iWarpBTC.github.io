name: Build and deploy to GitHub Pages

on:
  push:
    branches: [html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: sitemap lastmod dates come from `git log` per
          # file. In the default depth-1 clone that returns nothing and every date
          # would silently collapse to the build date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify the migration is still faithful
        run: npm run verify

      - name: Fail if CNAME is missing
        run: test -f _site/CNAME || (echo "CNAME missing — the custom domain would drop" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
